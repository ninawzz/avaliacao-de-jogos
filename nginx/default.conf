server {
    listen 80;

    # Domínio usado para identificar o GAMEBOXE.
    server_name gameboxe.empresa.test;

    location / {
        # Nome do serviço web definido no Docker Compose.
        proxy_pass http://gameboxe-web:80;

        # Preserva informações da requisição original.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Rejeita domínios desconhecidos.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
